<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>Playback Speed</title>
      <link rel="stylesheet" href="../ui/ui.css">
    </head>
    <body class="popup">
      <header class="header">
        <img src="../images/youtube_playback32.png" alt="" width="20" height="20">
        <h1 class="header-title">Playback Speed</h1>
        <button id="openSettings" class="icon-button" type="button" title="Settings" aria-label="Open settings">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
        </button>
      </header>

      <section class="section" aria-labelledby="tabHeading">
        <div class="row">
          <h2 id="tabHeading" class="label">This tab</h2>
          <span id="tabSpeed" class="tab-speed">–</span>
        </div>
        <div class="chips" role="group" aria-labelledby="tabHeading">
          <button class="chip" type="button" data-speed="0.5" disabled>0.5x</button>
          <button class="chip" type="button" data-speed="1" disabled>1x</button>
          <button class="chip" type="button" data-speed="1.5" disabled>1.5x</button>
          <button class="chip" type="button" data-speed="2" disabled>2x</button>
        </div>
        <p id="speedReason" class="hint" hidden></p>
        <div id="channelRule" class="row compact-row" hidden>
          <span id="channelRuleText" class="hint channel-name"></span>
          <button id="channelRuleButton" class="pill-button small" type="button"></button>
        </div>
        <p id="noVideo" class="hint" hidden>Open or refresh a YouTube video to change its speed here.</p>
      </section>

      <section class="section">
        <div class="row">
          <label class="label-group" for="defaultSpeed">
            <span class="label">Default speed</span>
            <span class="hint">For every video you open</span>
          </label>
          <span class="field">
            <input id="defaultSpeed" class="text-input" type="number" min="0.1" max="16" step="0.1"
                   data-setting="DEFAULT_SPEED" data-kind="speed" aria-describedby="defaultSpeed-error">
            <span class="suffix">x</span>
          </span>
        </div>
        <p id="defaultSpeed-error" class="error" role="alert"></p>
        <div class="row">
          <label class="label-group" for="skipAds">
            <span class="label">Speed through ads</span>
            <span class="hint">16x and muted</span>
          </label>
          <input id="skipAds" class="switch" type="checkbox" role="switch" data-setting="SKIP_ADS">
        </div>
      </section>

      <footer class="footer">
        <a href="https://www.buymeacoffee.com/noahksolomon" target="_blank" rel="noopener">Buy me a coffee</a>
      </footer>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <script src="../scripts/sharedObjects.js"></script>
      <script src="../ui/settings.js"></script>
      <script src="../ui/rules.js"></script>
      <script src="./popup.js"></script>
    </body>
</html>
